<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="雛 (Hina) — ブラウザで作るVRChat用アバター。VRM 0.x書き出し・完全ローカル・依存ゼロ">
<title>雛 — VRM Avatar Maker</title>
<style>
:root{
  --accent:#00C4CC; --accent-dim:#00939a;
  --bg:#0F1216; --surface:#161B22; --surface2:#1d242e; --line:#2a323e;
  --text:#E8ECEF; --text-dim:#9aa6b2; --text-faint:#5f6b78;
  --ok:#4cc26b; --warn:#e0b34a; --err:#e05a5a;
  --r-e:#4cc26b; --r-g:#9ac24c; --r-m:#e0b34a; --r-p:#e0824a; --r-vp:#e05a5a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.6 "Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface);flex:none}
.logo{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:24px;letter-spacing:.05em;display:flex;align-items:baseline;gap:10px}
.logo b{color:var(--accent);font-weight:600}
.logo span{font-size:11px;color:var(--text-faint);letter-spacing:.25em;text-transform:uppercase}
.hdr-actions{display:flex;gap:8px}
.hbtn{padding:6px 12px;border:1px solid var(--line);border-radius:6px;color:var(--text-dim);font-size:12px;background:var(--surface2)}
.hbtn:hover{border-color:var(--accent);color:var(--text)}
main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;min-width:0;background:radial-gradient(120% 90% at 50% 30%, #1a2027 0%, #0F1216 70%)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing}
#rankWrap{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.rankBadge{display:flex;align-items:center;gap:8px;background:rgba(15,18,22,.82);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;backdrop-filter:blur(4px)}
.rankBadge .lbl{color:var(--text-faint);font-size:10px;letter-spacing:.1em;width:42px}
.rankBadge .val{font-weight:700}
#hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--text-faint);background:rgba(15,18,22,.7);padding:4px 12px;border-radius:99px;pointer-events:none;white-space:nowrap}
#panel{width:380px;flex:none;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--surface)}
#tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line);flex:none}
.tab{flex:1 0 auto;padding:9px 4px;font-size:12px;color:var(--text-dim);border-bottom:2px solid transparent;min-width:44px}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab:hover{color:var(--text)}
#tabBody{flex:1;overflow-y:auto;padding:14px 16px 40px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.row{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.row label{flex:0 0 108px;font-size:12px;color:var(--text-dim)}
.row input[type=range]{flex:1;accent-color:var(--accent);height:22px}
.row .num{flex:0 0 56px;font-size:11px;color:var(--text-faint);text-align:right;font-variant-numeric:tabular-nums}
.row input.numIn{font-size:11px;background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:3px 5px;height:24px;cursor:text}
.row input.numIn:hover{border-color:var(--accent)}
.limit{display:block;font-size:10px;color:var(--text-faint);margin-top:3px;line-height:1.4}
.row select,.row input[type=text]{flex:1;background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px 8px;font-size:12px}
.row input[type=color]{flex:0 0 40px;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);padding:2px;cursor:pointer}
.row .swatches{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.sw{width:20px;height:20px;border-radius:50%;border:1px solid rgba(255,255,255,.18);cursor:pointer;padding:0}
.sw:hover{transform:scale(1.15)}
.row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.sect{font-size:11px;letter-spacing:.15em;color:var(--text-faint);margin:20px 0 10px;border-bottom:1px solid var(--line);padding-bottom:4px}
.sect:first-child{margin-top:0}
.presetGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.preCard{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;transition:border-color .15s}
.preCard:hover{border-color:var(--accent)}
.preCard .nm{font-size:14px;margin-bottom:6px}
.preCard .cols{display:flex;gap:4px}
.preCard .c{width:16px;height:16px;border-radius:50%;border:1px solid rgba(255,255,255,.15)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);font-size:13px;color:var(--text)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#06282a;font-weight:700}
.btn.primary:hover{background:#1ad3da}
.btn.wide{width:100%;margin-bottom:10px}
.statTable{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:14px}
.statTable td{padding:5px 6px;border-bottom:1px solid var(--line)}
.statTable td:first-child{color:var(--text-dim)}
.statTable td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.rk{font-weight:700;padding:1px 8px;border-radius:99px;font-size:11px}
.note{font-size:11px;color:var(--text-faint);margin:8px 0 14px;line-height:1.7}
.note a{color:var(--accent)}
dialog{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:24px;max-width:420px;margin:auto}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{font-size:16px;margin-bottom:12px}
dialog p{font-size:12px;color:var(--text-dim);margin-bottom:10px}
#selftestBox{position:absolute;top:12px;right:12px;background:rgba(15,18,22,.9);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:11px;max-width:280px;display:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media (max-width:760px){
  main{flex-direction:column}
  #stage{flex:0 0 44vh}
  #panel{width:100%;flex:1;border-left:none;border-top:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){.preCard,.sw{transition:none}}
</style>
</head>
<body>
<header>
  <div class="logo"><b>雛</b><span>Hina · VRM Avatar Maker</span></div>
  <div class="hdr-actions">
    <button class="hbtn" id="btnMode" aria-pressed="false"></button>
    <button class="hbtn" id="btnLang">EN</button>
    <button class="hbtn" id="btnAbout" aria-label="About">?</button>
  </div>
</header>
<main>
  <section id="stage">
    <canvas id="gl" tabindex="0" role="img"></canvas>
    <div id="rankWrap">
      <div class="rankBadge"><span class="lbl">PC</span><span class="val" id="rankPC">—</span></div>
      <div class="rankBadge"><span class="lbl">QUEST</span><span class="val" id="rankQ">—</span></div>
    </div>
    <div id="hint"></div>
    <div id="selftestBox"></div>
    <div id="srStatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  </section>
  <aside id="panel">
    <nav id="tabs" role="tablist"></nav>
    <div id="tabBody"></div>
  </aside>
</main>
<dialog id="aboutDlg">
  <h2>雛 (Hina) <span id="aboutVer"></span></h2>
  <p id="aboutTxt"></p>
  <p style="font-size:11px;color:var(--text-faint)">MIT License · © 2026 shizukutanaka<br>VRM is a registered trademark of the VRM Consortium.</p>
  <button class="btn" id="aboutClose">OK</button>
</dialog>
<script id="hina-core">
