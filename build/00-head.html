<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<meta name="description" content="雛 (Hina) — ブラウザで作るVRChat用アバター。VRM 0.x書き出し・完全ローカル・依存ゼロ">
<meta name="theme-color" content="#0F1216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="雛">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230F1216' rx='5'/%3E%3Ctext x='16' y='24' font-size='20' text-anchor='middle' fill='%2300C4CC' font-family='serif'%3E雛%3C/text%3E%3C/svg%3E">
<title>雛 — VRM Avatar Maker</title>
<style>
:root{
  color-scheme:dark;
  --accent:#00C4CC; --accent-dim:#00939a;
  --bg:#0F1216; --surface:#161B22; --surface2:#1d242e; --line:#2a323e;
  --text:#E8ECEF; --text-dim:#9aa6b2; --text-faint:#7a868f;
  --ok:#4cc26b; --warn:#e0b34a; --err:#e05a5a;
  --r-e:#4cc26b; --r-g:#9ac24c; --r-m:#e0b34a; --r-p:#e0824a; --r-vp:#e05a5a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.6 "Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface);flex:none}
.logo{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:24px;letter-spacing:.05em;display:flex;align-items:baseline;gap:10px}
.logo b{color:var(--accent);font-weight:600}
.logo span{font-size:11px;color:var(--text-faint);letter-spacing:.25em;text-transform:uppercase}
.hdr-actions{display:flex;gap:8px}
.hbtn{padding:6px 12px;border:1px solid var(--line);border-radius:6px;color:var(--text-dim);font-size:12px;background:var(--surface2)}
.hbtn:hover{border-color:var(--accent);color:var(--text)}
.hbtn:disabled{opacity:.45;cursor:not-allowed;pointer-events:none}
main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;min-width:0;background:radial-gradient(120% 90% at 50% 30%, #1a2027 0%, #0F1216 70%);contain:layout paint style}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#gl.drag{cursor:grabbing}
#rankWrap{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.rankBadge{display:flex;align-items:center;gap:8px;background:rgba(15,18,22,.82);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;backdrop-filter:blur(4px)}
.rankBadge[role=button]{cursor:pointer;pointer-events:auto}
.rankBadge[role=button]:hover{border-color:var(--accent);background:rgba(15,18,22,.95)}
.rankBadge .lbl{color:var(--text-faint);font-size:10px;letter-spacing:.1em;width:42px}
.rankBadge .val{font-weight:700}
#hint{position:absolute;bottom:10px;left:50%;translate:-50% 0;font-size:11px;color:var(--text-faint);background:rgba(15,18,22,.7);padding:4px 12px;border-radius:99px;pointer-events:none;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
#panel{width:380px;flex:none;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--surface)}
#tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line);flex:none}
.tab{flex:1 0 auto;padding:9px 4px;font-size:12px;color:var(--text-dim);border-bottom:2px solid transparent;min-width:44px}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab:hover{color:var(--text)}
#tabBody{flex:1;overflow-y:auto;padding:14px 16px 40px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;overscroll-behavior-y:contain;scrollbar-gutter:stable}
.row{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.row label{flex:0 0 108px;font-size:12px;color:var(--text-dim)}
.row input[type=range]{flex:1;accent-color:var(--accent);height:22px}
.row .num{flex:0 0 56px;font-size:11px;color:var(--text-faint);text-align:right;font-variant-numeric:tabular-nums}
.row input.numIn{font-size:11px;background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:3px 5px;height:24px;cursor:text;appearance:textfield;-moz-appearance:textfield}
.row input.numIn::-webkit-inner-spin-button,.row input.numIn::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.row input.numIn:hover{border-color:var(--accent)}
.row:focus-within{background:rgba(0,196,204,.04);border-radius:6px}
.row:has([aria-invalid="true"]){background:rgba(224,90,90,.06);border-radius:6px}
.limit{display:block;font-size:10px;color:var(--text-faint);margin-top:3px;line-height:1.4}
.row select,.row input[type=text]{flex:1;background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px 8px;font:inherit;font-size:12px}
input::placeholder{color:var(--text-dim);opacity:1}
.row input[type=color]{flex:0 0 40px;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);padding:2px;cursor:pointer}
.row .swatches{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.sw{width:20px;height:20px;border-radius:50%;border:1px solid rgba(255,255,255,.18);cursor:pointer;padding:0}
.sw:hover{scale:1.15}
.sw[aria-pressed=true]{outline:2px solid var(--accent);outline-offset:2px}
.row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.sect{font-size:11px;letter-spacing:.15em;color:var(--text-faint);margin:20px 0 10px;border-bottom:1px solid var(--line);padding-bottom:4px}
.sect:first-child{margin-top:0}
.presetGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.preCard{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;transition:border-color .15s}
.preCard:hover{border-color:var(--accent)}
.preCard.selected{border-color:var(--accent);background:rgba(0,196,204,.07);}
.preCard .nm{font-size:14px;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preCard .cols{display:flex;gap:4px}
.preCard .c{width:16px;height:16px;border-radius:50%;border:1px solid rgba(255,255,255,.15)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);font-size:13px;color:var(--text)}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed;pointer-events:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#06282a;font-weight:700}
.btn.primary:hover{background:#1ad3da}
.btn.primary:focus-visible{outline-color:#06282a}
.btn.wide{width:100%;margin-bottom:10px}
.statTable{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:14px}
.statTable td,.statTable th{padding:5px 6px;border-bottom:1px solid var(--line);font-weight:normal;text-align:left}
.statTable th{color:var(--text-dim)}
.statTable td{text-align:right;font-variant-numeric:tabular-nums}
.rk{font-weight:700;padding:1px 8px;border-radius:99px;font-size:11px}
.note{font-size:11px;color:var(--text-faint);margin:8px 0 14px;line-height:1.7;text-wrap:pretty}
.note a{color:var(--accent)}
dialog{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:24px;max-width:420px;margin:auto;max-height:90vh;max-height:90dvh;overflow-y:auto;overscroll-behavior:contain;opacity:0;transition:opacity .2s,display .2s allow-discrete}
dialog[open]{opacity:1}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{font-size:16px;margin-bottom:12px;text-wrap:balance}
dialog p{font-size:12px;color:var(--text-dim);margin-bottom:10px;text-wrap:pretty}
#selftestBox{position:absolute;top:12px;right:12px;background:rgba(15,18,22,.9);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:11px;max-width:280px;display:none}
#exprBar{position:absolute;bottom:38px;left:50%;translate:-50% 0;display:flex;gap:3px;pointer-events:auto;background:rgba(15,18,22,.80);border:1px solid var(--line);border-radius:99px;padding:3px 8px;backdrop-filter:blur(4px)}
.eBtn{min-width:30px;min-height:24px;padding:0 6px;font-size:10px;color:var(--text-dim);border-radius:99px;flex:none;letter-spacing:-.02em}
.eBtn:hover{background:rgba(0,196,204,.18);color:var(--text)}
.eBtn.active{background:var(--accent);color:#06282a;font-weight:700}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
body.drag-over::after{content:'';position:fixed;inset:0;border:3px dashed var(--accent);border-radius:8px;pointer-events:none;background:rgba(0,196,204,.06);z-index:999;opacity:1;transition:opacity .15s}
@starting-style{body.drag-over::after{opacity:0}}
details[open]>:not(summary){opacity:1;transition:opacity .2s}
@starting-style{details[open]>:not(summary){opacity:0}}
@starting-style{dialog[open]{opacity:0}}
@media (max-width:760px){
  main{flex-direction:column}
  #stage{flex:0 0 44vh;flex:0 0 44dvh}
  #panel{width:100%;flex:1;border-left:none;border-top:1px solid var(--line)}
  /* iOS Safari auto-zooms focused inputs whose font-size is below 16px and does not zoom back.
     Bumping touch-device inputs to 16px keeps the layout viewport unchanged on focus. */
  .row select,.row input[type=text],.row input.numIn{font-size:16px}
}
#skipLink{transition:top .1s}
#skipLink:focus-visible{top:8px}
#autoSaveBadge{transition:opacity .3s}
@media (hover:none){.sw:hover{scale:1}}
@media (pointer:coarse){.eBtn{min-height:36px;padding:0 10px}}
@media (prefers-contrast:more){:root{--text-dim:#c0ccd8;--text-faint:#9aa6b2;--line:#3f4f62}}
@media (prefers-reduced-transparency:reduce){.rankBadge,#exprBar{backdrop-filter:none;background:var(--bg)}#hint{background:var(--bg)}dialog::backdrop{background:rgba(0,0,0,.85)}}
@media (prefers-reduced-motion:reduce){.preCard,.sw,#autoSaveBadge,#skipLink,body.drag-over::after,details[open]>:not(summary),dialog{transition:none}.sw:hover{scale:1}}
@media (forced-colors:active){
  .rk{forced-color-adjust:none;outline:1px solid ButtonText}
  .sw{forced-color-adjust:none;outline:2px solid ButtonText}
  .rankBadge .val{forced-color-adjust:none}
  .preCard.selected{outline:2px solid Highlight}
}
@media print{
  #stage,#hint,#exprBar,#selftestBox,.hdr-actions,#skipLink{display:none}
  html,body{height:auto;overflow:visible}
  main{height:auto}
  #panel{width:100%;border-left:none}
  #tabBody{overflow:visible;height:auto;max-height:none;padding-bottom:0}
}
</style>
</head>
<body>

<noscript><div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;text-align:center;padding:24px"><div><div style="font-size:32px;margin-bottom:16px">雛</div><p style="margin-bottom:8px">このツールの使用には JavaScript が必要です。</p><p style="color:var(--text-dim)">Hina requires JavaScript to run. Please enable it in your browser settings.</p></div></div></noscript>

</dialog>
<script id="hina-core">
